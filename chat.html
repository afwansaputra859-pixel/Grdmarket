<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat Toko</title>

    <!-- FIREBASE SDK (COMPAT VERSION) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- ONESIGNAL SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "65f2eb4f-bc7f-4886-896a-f1165ee2bc3a",
          notifyButton: { enable: false }
        });
      });
    </script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chatBox { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 14px; word-wrap: break-word; }
        .buyer { background: #dcf8c6; align-self: flex-end; }
        .admin { background: #ffffff; align-self: flex-start; }
        .input-box { display: flex; padding: 10px; background: #eee; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #128c7e; color: white; border: none; padding: 10px 15px; margin-left: 5px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header id="chatHeader">Private Chat</header>
    <div id="chatBox"></div>
    <div class="input-box">
        <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') kirimPesan()">
        <button onclick="kirimPesan()">➤</button>
    </div>

    <script>
        // KONFIGURASI FIREBASE SESUAI SCREENSHOT
        const firebaseConfig = {
            apiKey: "AIzaSyBbsDmS4Hkqf_PC7XwAWI4uKtK-WMeYD2U",
            authDomain: "website-611eb.firebaseapp.com",
            databaseURL: "https://website-611eb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "website-611eb",
            storageBucket: "website-611eb.firebasestorage.app",
            messagingSenderId: "90650745026",
            appId: "1:90650745026:web:7c9dc54997c4970c8e035b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // AMBIL DATA URL (ROOM & PRODUK)
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || "default_room";
        const namaProduk = urlParams.get('produk') || "Produk";
        const currentUser = sessionStorage.getItem("currentUser") || "Pembeli";

        document.getElementById("chatHeader").innerText = "Chat Order: " + namaProduk;

        // BACA PESAN REALTIME DARI FIREBASE
        db.ref("chats/" + roomId).on("child_added", function(snapshot) {
            const data = snapshot.val();
            const box = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = "msg " + (data.sender === "Admin" ? "admin" : "buyer");
            div.innerText = data.sender + ": " + data.text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });

        // KIRIM PESAN KE FIREBASE & MEMICU NOTIFIKASI
        function kirimPesan() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (text === "") return;

            db.ref("chats/" + roomId).push({
                sender: currentUser,
                text: text,
                timestamp: Date.now()
            });

            // PICU SPANDUK NOTIFIKASI MELAYANG DI HP (WEB PUSH)
            if (window.Notification && Notification.permission === "granted") {
                new Notification("Pesan Baru dari " + currentUser, {
                    body: text,
                    icon: "https://via.placeholder.com/128"
                });
            }

            input.value = "";
        }
    </script>
</body>
</html>
